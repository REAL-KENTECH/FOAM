    overrides: {optimizer: stale_shampoo, precondition_frequency: 50, start_preconditioning_step: 50, matrix_root_inv_threshold: 0.0, max_epsilon: 1.0e-9}
  - name: foam_f50
    overrides: {optimizer: foam, precondition_frequency: 50, start_preconditioning_step: 50}
  - name: foam_no_adaptive_epsilon_f50
    overrides: {optimizer: foam_no_adaptive_epsilon, precondition_frequency: 50, start_preconditioning_step: 50}
  - name: foam_no_evd_refresh_f50
    overrides: {optimizer: foam_no_evd_refresh, precondition_frequency: 50, start_preconditioning_step: 50}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foam-vit-reconstructed"
version = "1.0.0"
description = "Reconstructed FOAM ViT/ImageNet experiments with canonical refresh-controller implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "Pillow>=9.5",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
paper = [
  "timm>=1.0",
  "datasets>=2.19",
  "wandb>=0.17",
]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["foam_experiments*", "optimizers*"]
exclude = ["optimizers.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
